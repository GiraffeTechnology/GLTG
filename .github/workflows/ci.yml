name: GLTG CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test GLTG (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # No env pinning: CI must exercise the shipped defaults (deterministic
    # evaluator, no LLM calls). Evaluator tests that need llm mode set it
    # explicitly with the deterministic mock provider.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile sources, tests, and scripts
        run: python -m compileall -q src tests scripts

      - name: Unit + API tests
        run: pytest -q

      - name: Unified giraffe-db data-ID contract scan
        run: python scripts/check_unified_data_ids.py --repo .

      - name: API edge cases (0/1/2/3+ suppliers)
        run: python scripts/run_api_edge_cases.py

      - name: Determinism (5x)
        run: python scripts/verify_gltg_5x.py

      - name: Zero/one/two supplier cases
        run: python scripts/run_zero_one_two_supplier_cases.py

      - name: Start API server
        run: |
          nohup uvicorn gltg.api.main:app --host 0.0.0.0 --port 8090 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/health > /dev/null; then
              echo "server up"; break
            fi
            sleep 1
          done

      - name: GET /health
        run: |
          curl -sf http://localhost:8090/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: GET /version
        run: |
          curl -sf http://localhost:8090/version | tee /dev/stderr | grep -q '"service":"gltg"'

      - name: POST /v1/lead-time/estimate
        run: |
          # updated from service-layer value 28 to engine value 124 after DEFECT-01
          # + DEFECT-03 (engine full-workflow commitable lead time with capacity-
          # bound SEWING; deadline_days raised to 300 so the ~124d order is feasible).
          curl -sf http://localhost:8090/v1/lead-time/estimate \
            -H 'content-type: application/json' \
            -d '{"order":{"product_type":"apparel","quantity":10000,"deadline_days":300},
                 "suppliers":[{"supplier_id":"M1","capacity_per_day":800,"material_ready_days":5,
                 "production_days":14,"qc_days":2,"logistics_days":7,"confidence":0.8}]}' \
            | tee /dev/stderr | grep -q '"estimated_lead_time_days":124'

      - name: POST /v1/paths/enumerate
        run: |
          curl -sf http://localhost:8090/v1/paths/enumerate \
            -H 'content-type: application/json' \
            -d '{"order":{"quantity":10000},"suppliers":[
                 {"supplier_id":"A","material_ready_days":5,"production_days":14,"qc_days":2,"logistics_days":7,"confidence":0.8},
                 {"supplier_id":"B","material_ready_days":5,"production_days":10,"qc_days":2,"logistics_days":7,"confidence":0.8}]}' \
            | tee /dev/stderr | grep -q '"paths"'

      - name: POST /v1/reforecast
        run: |
          curl -sf http://localhost:8090/v1/reforecast \
            -H 'content-type: application/json' \
            -d '{"order":{"quantity":10000},"suppliers":[
                 {"supplier_id":"M1","capacity_per_day":800,"material_ready_days":5,
                 "production_days":14,"qc_days":2,"logistics_days":7,"confidence":0.8}],
                 "events":[{"supplier_id":"M1","production_days_delta":6}]}' \
            | tee /dev/stderr | grep -q '"updated_lead_time_days"'

      - name: GET /ready
        run: |
          curl -sf http://localhost:8090/ready | tee /dev/stderr | grep -q '"ready":true'

      - name: POST /v2/lead-time/simulate (deterministic default, contract fields)
        run: |
          curl -sf http://localhost:8090/v2/lead-time/simulate \
            -H 'content-type: application/json' \
            -d '{"request_id":"CI-V2-1","order":{"product_type":"t-shirt","quantity":5000,"deadline_days":150},
                 "supplier":{"supplier_id":"GDB_SYN_V1_SUP_000001","capacity_per_day":500,
                 "material_ready_days":7,"production_days":12,"qc_days":3,"logistics_days":18,"confidence":0.75},
                 "source_observation_ids":["GDB_SYN_V1_OBS_000001"]}' \
            | tee /dev/stderr \
            | python -c "import json,sys; b=json.load(sys.stdin); assert b['evaluation_mode']=='deterministic', b['evaluation_mode']; q=b['quantiles']; assert 0<q['p50_days']<=q['p80_days']<=q['p90_days']; assert b['persistence']['status'] in ('unavailable','skipped'); assert b['source_observation_ids']==['GDB_SYN_V1_OBS_000001']; print('v2 contract ok')"

      - name: POST /v2/reforecast (events applied, delta disclosed)
        run: |
          curl -sf http://localhost:8090/v2/reforecast \
            -H 'content-type: application/json' \
            -d '{"request_id":"CI-V2-2","order":{"product_type":"t-shirt","quantity":5000,"deadline_days":150},
                 "supplier":{"supplier_id":"GDB_SYN_V1_SUP_000001","capacity_per_day":500,
                 "material_ready_days":7,"production_days":12,"qc_days":3,"logistics_days":18,"confidence":0.75},
                 "events":[{"event_type":"supplier_response_delay","response_delay_ratio":3.5}]}' \
            | tee /dev/stderr \
            | python -c "import json,sys; b=json.load(sys.stdin); assert b['applied_events']; assert b['previous_quantiles'] is not None; assert b['delta']['p50_days']>=0; print('v2 reforecast ok')"

  giraffe-db-e2e:
    name: Real HTTP E2E vs giraffe-db
    runs-on: ubuntu-latest
    # giraffe-db is a private repository; the real-HTTP E2E runs when a token
    # with read access is configured (GIRAFFE_DB_CI_TOKEN secret). Without it,
    # the job reports the skip explicitly instead of faking the integration.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check giraffe-db access
        id: gdb
        env:
          GIRAFFE_DB_CI_TOKEN: ${{ secrets.GIRAFFE_DB_CI_TOKEN }}
        run: |
          if [ -n "$GIRAFFE_DB_CI_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GIRAFFE_DB_CI_TOKEN not configured; real-HTTP giraffe-db E2E skipped (run scripts/validate_gltg_giraffe_db_e2e.py locally)."
          fi

      - name: Clone giraffe-db
        if: steps.gdb.outputs.available == 'true'
        env:
          GIRAFFE_DB_CI_TOKEN: ${{ secrets.GIRAFFE_DB_CI_TOKEN }}
        run: |
          git clone "https://x-access-token:${GIRAFFE_DB_CI_TOKEN}@github.com/GiraffeTechnology/giraffe-db.git" ../giraffe-db

      - name: Install GLTG + giraffe-db
        if: steps.gdb.outputs.available == 'true'
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "../giraffe-db[dev]"

      - name: Real HTTP E2E (GLTG <-> giraffe-db)
        if: steps.gdb.outputs.available == 'true'
        run: python scripts/validate_gltg_giraffe_db_e2e.py

  docker:
    name: Docker build + startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t giraffe-gltg:ci .

      - name: Startup smoke (non-root, /health, /ready, v2 deterministic)
        run: |
          docker run -d --name gltg -p 8090:8090 giraffe-gltg:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/health > /dev/null; then break; fi
            sleep 1
          done
          docker exec gltg id -u | grep -qv '^0$'
          curl -sf http://localhost:8090/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8090/ready | grep -q '"evaluator_mode":"deterministic"'
          curl -sf http://localhost:8090/v2/lead-time/simulate \
            -H 'content-type: application/json' \
            -d '{"request_id":"CI-DOCKER","order":{"product_type":"t-shirt","quantity":1000}}' \
            | grep -q '"evaluation_mode":"deterministic"'
          docker rm -f gltg
